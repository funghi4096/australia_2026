    <script>
        // === 圖片瀏覽器核心邏輯 (精準縮放 + 狀態保留) ===
        const viewer = document.getElementById('image-viewer');
        const viewerImg = document.getElementById('viewer-img');
        
        let state = { x: 0, y: 0, scale: 1 };
        let gesture = { 
            startX: 0, startY: 0, 
            startScale: 1, 
            startDist: 0, 
            startCenter: { x: 0, y: 0 },
            startXVal: 0, startYVal: 0,
            isPanning: false,
            isZooming: false
        };
        let lastTapTime = 0;

        function updateTransform() {
            viewerImg.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
        }

        function resetViewer() {
            state = { x: 0, y: 0, scale: 1 };
            updateTransform();
        }

        function openImageViewer(src) {
            viewerImg.src = src;
            viewer.classList.remove('hidden');
            requestAnimationFrame(() => {
                viewer.classList.remove('opacity-0');
                resetViewer();
            });
        }

        function closeImageViewer() {
            viewer.classList.add('opacity-0');
            setTimeout(() => {
                viewer.classList.add('hidden');
                viewerImg.src = "";
            }, 300);
        }

        // 全域圖片點擊監聽
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'IMG' && (e.target.closest('.rich-text') || e.target.closest('#image-viewer') === null)) {
                openImageViewer(e.target.src);
            }
        });

        // 輔助函式：計算兩指距離與中心
        const getDist = (touches) => Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        const getCenter = (touches) => ({
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2
        });

        // Touch Start
        viewer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                // 雙擊檢測
                const now = new Date().getTime();
                if (now - lastTapTime < 300) {
                    e.preventDefault();
                    resetViewer();
                } else {
                    // 開始拖曳 (Pan)
                    gesture.isPanning = true;
                    gesture.isZooming = false;
                    gesture.startX = e.touches[0].clientX;
                    gesture.startY = e.touches[0].clientY;
                    gesture.startXVal = state.x;
                    gesture.startYVal = state.y;
                }
                lastTapTime = now;
            } else if (e.touches.length === 2) {
                // 開始縮放 (Zoom)
                e.preventDefault();
                gesture.isZooming = true;
                gesture.isPanning = false;
                gesture.startDist = getDist(e.touches);
                gesture.startCenter = getCenter(e.touches);
                gesture.startScale = state.scale;
                gesture.startXVal = state.x;
                gesture.startYVal = state.y;
            }
        });

        // Touch Move
        viewer.addEventListener('touchmove', (e) => {
            if (gesture.isZooming && e.touches.length === 2) {
                e.preventDefault();
                
                // 1. 計算縮放比例
                const currDist = getDist(e.touches);
                const currCenter = getCenter(e.touches);
                const scaleRatio = currDist / gesture.startDist;
                let newScale = gesture.startScale * scaleRatio;
                newScale = Math.max(1, Math.min(newScale, 10)); // 限制縮放倍率

                // 2. 計算中心點位移 (跟隨手指移動)
                const deltaCenter = { 
                    x: currCenter.x - gesture.startCenter.x, 
                    y: currCenter.y - gesture.startCenter.y 
                };

                // 3. 計算縮放補償 (Zoom towards fingers)
                const viewCenter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
                const oldOriginX = gesture.startCenter.x - viewCenter.x - gesture.startXVal;
                const oldOriginY = gesture.startCenter.y - viewCenter.y - gesture.startYVal;
                
                const expansionX = oldOriginX * (newScale / gesture.startScale - 1);
                const expansionY = oldOriginY * (newScale / gesture.startScale - 1);

                state.scale = newScale;
                state.x = gesture.startXVal + deltaCenter.x - expansionX;
                state.y = gesture.startYVal + deltaCenter.y - expansionY;
                
                updateTransform();

            } else if (gesture.isPanning && e.touches.length === 1 && state.scale > 1) {
                e.preventDefault();
                // 只有放大狀態下才允許拖曳
                const dx = e.touches[0].clientX - gesture.startX;
                const dy = e.touches[0].clientY - gesture.startY;
                state.x = gesture.startXVal + dx;
                state.y = gesture.startYVal + dy;
                updateTransform();
            }
        });

        // Touch End (不做自動復原，保留狀態)
        viewer.addEventListener('touchend', (e) => {
            gesture.isZooming = false;
            gesture.isPanning = false;
            // 如果縮小到比 1 還小，才自動復原
            if (state.scale < 1) {
                resetViewer();
            }
        });

                        fullContent: `

                            <li><strong>S (畫斜線)</strong>：No Stopping，任何時間都不能停，連臨停下客都不行。</li>
                            <li><strong>P (畫斜線)</strong>：No Parking，可以臨停下客 (駕駛不能離開座位)，通常限時 2 分鐘。</li>
                            <li><strong>Clearway</strong>：拖吊區，特定時間內絕對不能停，會直接被拖走。</li>
                        </ul>
                    </div>

                    <div class="info-box">
                        <strong>⏰ 時間限制與箭頭</strong><br>
                        注意看牌子上的時間 (例如 Mon-Fri 9am-5pm)。<br>
                        <strong>箭頭</strong>指向哪邊，規則就適用於哪邊的車位。
                    </div>
                `;
            }

            const modal = document.getElementById('full-screen-modal');
            const modalContent = document.getElementById('full-screen-content');
            
            // 填充內容
            document.querySelector('#full-screen-modal h3').innerText = title;
            modalContent.innerHTML = content;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex', 'modal-enter');
        }

        window.onload = () => { renderTabs(); renderContent(); };
    </script>
</body>
</html>
