            { day: 10, date: "10/27 (二)", label: "最後留念與回程", items: [
                { time: "10:00", title: "與袋熊最後相會", loc: "Ballarat Wildlife Park", desc: "別忘了詢問 Wombat encounter！這裡是看袋熊最後機會。", driveTime: "🚗 5 分鐘", detail: "🐨 動物園：\n必做：Wombat Encounter\n體驗：餵袋鼠", fullContent: "<h4 class='text-xl font-bold text-emerald-700 mb-4'>🐨 Ballarat Wildlife Park</h4><p>可以近距離接觸袋熊 (Wombat Encounter)，也可以親手餵袋鼠。</p>" },
                { time: "15:00", title: "DFO 最後血拼", loc: "DFO Essendon", desc: "機場旁 Outlet。把握最後免稅店與伴手禮採買。", driveTime: "🚗 1 小時 10 分", detail: "🛍️ Outlet：\n重點：運動品牌、澳洲服飾", fullContent: "<h4 class='text-xl font-bold text-emerald-700 mb-4'>🛍️ DFO Essendon</h4><p>機場附近的 Outlet，適合最後衝刺採買。</p>" },
                { time: "18:00", title: "加油 (Refuel)", loc: "Melbourne Airport BP", desc: "加滿油準備還車。", driveTime: "🚗 10 分鐘", detail: "⛽ 加油：\n位置：機場 BP\n任務：加滿油、留收據", fullContent: "<h4 class='text-xl font-bold text-emerald-700 mb-4'>⛽ 還車前加油</h4><p>導航到 Melbourne Airport BP 把油加滿，並保留收據。</p>" },
                { time: "19:00", title: "還車手續", loc: "Andrew's Airport Parking (還車點)", desc: "在機場 BP 加油後還車。搭接駁車去機場，23:20 起飛。", driveTime: "🚗 5 分鐘", detail: "✈️ 還車：\n地點：Andrew's Airport Parking\n接駁：前往 T2 航廈", fullContent: "<h4 class='text-xl font-bold text-emerald-700 mb-4'>✈️ Apex 還車</h4><p>在 Andrew's Airport Parking 還車，檢查物品後搭接駁車去 T2 航廈。</p>" }
            ]}
        ];

        let currentDay = 1;

        // 初始化 Tabs
        function renderTabs() {
            const tabs = document.getElementById('tabs');
            tabs.innerHTML = itineraryData.map(d => `
                <button onclick="switchDay(${d.day})" id="tab-day-${d.day}" class="whitespace-nowrap px-5 py-2.5 rounded-full text-[11px] font-bold transition-all duration-300 ${currentDay === d.day ? 'tab-active' : 'bg-white text-slate-400 border border-slate-100'}">
                    DAY ${d.day}
                </button>
            `).join('');
        }

        function switchDay(day) {
            currentDay = day;
            renderTabs();
            renderContent();
            const activeTab = document.getElementById(`tab-day-${day}`);
            activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 渲染內容
        function renderContent() {
            const content = document.getElementById('content');
            const data = itineraryData.find(d => d.day === currentDay);
            
            // 標題
            let html = `<div class="mb-6 fade-in px-1">
                <p class="text-emerald-600 font-bold text-[10px] tracking-[0.2em] mb-1 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-check"></i> ${data.date}
                </p>
                <h2 class="text-2xl font-black text-slate-800">${data.label}</h2>
            </div>`;
            
            // 卡片
            html += data.items.map((item, i) => {
                let driveHtml = '';
                if (item.driveTime) {
                    driveHtml = `
                        <div class="drive-line fade-in" style="animation-delay: ${i*0.1}s">
                            <div class="drive-dashed"></div>
                            <div onclick="openNav('${item.loc}')" class="drive-badge shadow-sm hover:shadow-md">
                                ${item.driveTime} <i class="fa-solid fa-arrow-down text-[8px] ml-1"></i>
                            </div>
                            <div class="drive-dashed"></div>
                        </div>
                    `;
                }

                return `
                    ${driveHtml}
                    <div class="relative bg-white rounded-3xl card-shadow p-6 mb-2 fade-in border border-slate-50 transition-transform active:scale-[0.98]" 
                         style="animation-delay: ${i*0.1}s"
                         onclick="openDetail(${currentDay}, ${i})">
                        
                        <!-- 右上角詳情按鈕 -->
                        <button class="absolute top-5 right-5 text-slate-300 hover:text-emerald-500 transition-colors p-2">
                            <i class="fa-solid fa-angle-right text-lg"></i>
                        </button>

                        <span class="inline-block bg-slate-100 text-slate-600 text-[10px] font-black px-3 py-1 rounded-full mb-3">
                            ${item.time}
                        </span>
                        
                        <h3 class="text-lg font-bold text-slate-800 mb-2 pr-8 leading-tight">${item.title}</h3>
                        <p class="text-slate-500 text-xs leading-relaxed mb-4 font-medium line-clamp-2">${item.desc}</p>
                        
                        <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                            <div class="flex items-center text-slate-400 text-[10px] font-bold tracking-wider mr-2">
                                <i class="fa-solid fa-location-dot mr-1.5 text-emerald-400"></i>
                                <span class="truncate max-w-[100px] uppercase">${item.loc.split('(')[0]}</span>
                            </div>
                            <div class="flex gap-2">
                                <!-- 阻止冒泡，避免觸發卡片點擊 -->
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(item.loc)}" 
                                   target="_blank" 
                                   onclick="event.stopPropagation()"
                                   class="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px] font-bold shadow-lg shadow-slate-200 active:scale-95 transition-all flex items-center gap-1.5">
                                    <i class="fa-solid fa-diamond-turn-right"></i> 導航
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            html += `<div class="h-10"></div>`;
            content.innerHTML = html;
        }

        // 開啟導航
        function openNav(destination) {
            const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}`;
            window.open(url, '_blank');
        }

        // 開啟抽屜 (Drawer)
        let currentFullContent = ""; // 暫存完整內容
        function openDetail(day, index) {
            const data = itineraryData.find(d => d.day === day).items[index];
            const drawer = document.getElementById('detail-drawer');
            const header = document.getElementById('drawer-header');
            const body = document.getElementById('drawer-body');
            const content = drawer.querySelector('.drawer-content');
            const btnFullScreen = document.getElementById('btn-full-screen');

            header.innerHTML = `<h3 class="text-xl font-bold leading-tight">${data.title}</h3>`;
            
            // 簡易詳情
            const detailText = data.detail ? data.detail : data.desc;
            body.innerText = detailText;

            // 儲存完整內容供全螢幕使用
            // 如果沒有 fullContent，就用 detail 加強版代替
            currentFullContent = data.fullContent ? data.fullContent : `<h4 class="text-xl font-bold text-emerald-700 mb-4">${data.title}</h4><p class="whitespace-pre-wrap">${detailText}</p>`;

            // 顯示抽屜
            drawer.classList.remove('hidden');
            setTimeout(() => { content.classList.remove('translate-x-full'); }, 10);
            
            // 綁定全螢幕按鈕事件
            btnFullScreen.onclick = openFullScreen;
        }

        function closeDrawer() {
            const drawer = document.getElementById('detail-drawer');
            const content = drawer.querySelector('.drawer-content');
            content.classList.add('translate-x-full');
            setTimeout(() => { drawer.classList.add('hidden'); }, 300);
        }

        // 全螢幕視窗
        function openFullScreen() {
            const modal = document.getElementById('full-screen-modal');
            const content = document.getElementById('full-screen-content');
            content.innerHTML = currentFullContent;
            modal.classList.remove('hidden');
            modal.classList.add('flex', 'modal-enter');
            // 關閉抽屜
            closeDrawer();
        }

        function closeFullScreen() {
            const modal = document.getElementById('full-screen-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex', 'modal-enter');
        }

        // 底部資訊彈窗 (使用全螢幕 Modal 顯示更豐富資訊)
        function showInfo(type) {
            let title = "";
            let content = "";
            
            if (type === 'strategy') {
                title = "☀️ 天氣策略 & 動物指南";
                content = `
                    <h4 class="text-xl font-bold text-emerald-700 mb-4">☀️ 天氣決勝 (等級 S)</h4>
                    <p class="mb-4">以下景點極度依賴好天氣，請根據當天狀況靈活調整順序：</p>
                    <ul class="list-disc pl-5 space-y-2 mb-6">
                        <li><strong>Mt Oberon Summit</strong>：如果是陰天或霧天，山頂會一片白牆，什麼都看不到。一定要選晴天去。</li>
                        <li><strong>Squeaky Beach</strong>：陽光直射下，海水才會呈現寶石藍色。</li>
                        <li><strong>The Pinnacle</strong>：俯瞰山谷需要清晰視野，且雨天岩石濕滑危險。</li>
                    </ul>
                    
                    <h4 class="text-xl font-bold text-emerald-700 mb-4">🐨 動物尋蹤指南</h4>
                    <ul class="list-disc pl-5 space-y-2">
                        <li><strong>袋熊 (Wombat)</strong>：Tidal River 營區 (17:00-19:00)。</li>
                        <li><strong>袋鼠 (Kangaroo)</strong>：Halls Gap 湖畔或營地後方草地 (清晨/黃昏)。</li>
                        <li><strong>鴯鶓 (Emu)</strong>：Wilsons Prom 的草地。</li>
                    </ul>
                `;
            } else if (type === 'fruits') {
                title = "🍋 當季水果指南 (10月)";
                content = `
                    <h4 class="text-xl font-bold text-emerald-700 mb-4">🟢 當季盛產 (價格優/必吃)</h4>
                    <ul class="list-disc pl-5 space-y-3 mb-6">
                        <li><strong>草莓 (Strawberries)</strong>：10月是維多利亞州的草莓旺季，價格便宜且香甜。</li>
                        <li><strong>無籽綠葡萄 (Green Grapes)</strong>：澳洲的葡萄皮薄脆甜，洗一洗就能帶著當零食。</li>
                    </ul>

                    <h4 class="text-xl font-bold text-emerald-700 mb-4">🟠 產季尾聲/剛開始 (值得找)</h4>
                    <ul class="list-disc pl-5 space-y-3 mb-6">
                        <li><strong>血橙 (Blood Orange)</strong>：產季約在 8-10 月，如果您在 10 月初還有看到，請務必買！這是澳洲特有美味，果肉深紅甜度高。</li>
                        <li><strong>藍莓 (Blueberries)</strong>：新產季剛開始，可能稍微貴一點，但品質很棒。</li>
                    </ul>

                    <h4 class="text-xl font-bold text-slate-500 mb-4">⚪ 非產季 (特色嘗試)</h4>
                    <ul class="list-disc pl-5 space-y-3 mb-6 text-slate-500">
                        <li><strong>指橙 (Finger Lime)</strong>：主要產季在秋季 (3-5月)，10月較難在一般超市看到。如果想吃，可能要去高檔超市或農夫市集碰運氣 (價格會較高)。</li>
                        <li><strong>櫻桃 (Cherries)</strong>：產季通常 11 月中才開始，10 月還太早，超市看到的通常是進口貨。</li>
                        <li><strong>黑莓 (Blackberries)</strong>：夏季水果 (12-2月)，10月非產季。</li>
                    </ul>
                `;
            } else if (type === 'shopping') {
                title = "🛒 必買清單 (詳細版)";
                content = `
                    <h4 class="text-xl font-bold text-emerald-700 mb-4">☕ 茶類 (超市/專賣店)</h4>
                    <ul class="list-disc pl-5 space-y-3 mb-6">
                        <li><strong>Twinings Australian Afternoon</strong>：澳洲限定款，茶湯濃郁，適合加牛奶。超市常有 50% OFF (約 $6.75/100入)。</li>
                        <li><strong>Twinings Russian Caravan</strong>：獨特煙燻香氣，適合搭配酸種麵包。</li>
                        <li><strong>T2 Melbourne Breakfast</strong>：澳洲精品茶，經典香草味。建議買 25入盒裝 (約 $18) 或散茶鐵罐。</li>
                    </ul>

                    <h4 class="text-xl font-bold text-emerald-700 mb-4">🍯 蜂蜜 (Pure Peninsula Honey)</h4>
                    <ul class="list-disc pl-5 space-y-3 mb-6">
                        <li><strong>Yellow Box (黃盒桉)</strong>：口感滑順，不易結晶，澳洲蜂蜜的首選。</li>
                        <li><strong>Grey Box (灰盒桉)</strong>：甜度適中，也是不錯的選擇。</li>
                    </ul>

                    <h4 class="text-xl font-bold text-emerald-700 mb-4">🧴 藥妝與精油</h4>
                    <ul class="list-disc pl-5 space-y-3 mb-6">
                        <li><strong>Lucas Papaw Ointment (木瓜霜)</strong>：澳洲國民萬用膏，送禮自用兩相宜。</li>
                        <li><strong>Emu Oil (鴯鶓油)</strong>：滋潤修復，適合送長輩。</li>
                        <li><strong>Springfields 精油</strong>：有機認證，推薦尤加利或檸檬香桃木 (Lemon Myrtle)。</li>
                        <li><strong>Kwells 暈車藥</strong>：澳洲神藥，不嗜睡，適合這趟山路行程 (約 $5.5)。</li>
                    </ul>

                    <h4 class="text-xl font-bold text-emerald-700 mb-4">🍫 零食</h4>
                    <ul class="list-disc pl-5 space-y-3 mb-6">
                        <li><strong>Red Rock Deli 洋芋片</strong>：蜂蜜雞汁 (Honey Soy Chicken) 是經典。</li>
                        <li><strong>TimTam</strong>：各種限定口味。</li>
                        <li><strong>Pods</strong>：澳洲特有巧克力餅乾，咬開有餡。</li>
                    </ul>
                `;
            }

            const modal = document.getElementById('full-screen-modal');
            const modalContent = document.getElementById('full-screen-content');
            
            // 填充內容
            document.querySelector('#full-screen-modal h3').innerText = title;
            modalContent.innerHTML = content;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex', 'modal-enter');
        }

        window.onload = () => { renderTabs(); renderContent(); };
    </script>
</body>
</html>
