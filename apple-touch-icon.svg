<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景：柔和的大地棕色，圓角矩形 (iOS 風格) -->
    <rect width="192" height="192" rx="40" fill="#8D6E63"/>
    
    <!-- 耳朵 -->
    <circle cx="56" cy="64" r="18" fill="#5D4037"/>
    <circle cx="136" cy="64" r="18" fill="#5D4037"/>
    
    <!-- 臉型：圓潤的米色 -->
    <ellipse cx="96" cy="100" rx="70" ry="60" fill="#D7CCC8"/>
    
    <!-- 標誌性的裸鼻：深色倒三角/心形 -->
    <path d="M76 100C76 92 84 88 96 88C108 88 116 92 116 100C116 112 96 122 96 122C96 122 76 112 76 100Z" fill="#3E2723"/>
    
    <!-- 眼睛：分開一點比較可愛 -->
    <circle cx="68" cy="85" r="6" fill="#1A120B"/>
    <circle cx="124" cy="85" r="6" fill="#1A120B"/>
    
    <!-- 腮紅 -->
    <circle cx="58" cy="105" r="8" fill="#FFAB91" fill-opacity="0.6"/>
    <circle cx="134" cy="105" r="8" fill="#FFAB91" fill-opacity="0.6"/>
    
    <!-- 嘴巴 -->
    <path d="M88 128C88 128 92 132 96 132C100 132 104 128 104 128" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>
</svg>